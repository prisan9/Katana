function gradeKana(v, it) {
  const raw = v.trim().toLowerCase().replace(/[^a-zぁ-ゖァ-ヺー]/g, '');
  if (!raw) return false;
  if (/[ぁ-ヺ]/.test(raw)) return hira(raw) === hira(it.c);
  return raw === it.ro || it.alt.includes(raw);
}

/* typed answers: forgiving romaji (macrons, ou/ō, shi/si, tsu/tu…) or kana */
const hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
function normRo(s) {
  s = s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]/g, '');
  s = s.replace(/sh/g, 's').replace(/ch/g, 't').replace(/ts/g, 't').replace(/j/g, 'z').replace(/f/g, 'h');
  return s.replace(/ou/g, 'o').replace(/([aeiou])\1+/g, '$1');
}
function lev(a, b) {
  const m = a.length, n = b.length; const d = Array.from({length:m + 1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
function gradeType(v, w) {
  const raw = v.trim(); if (!raw) return {ok:false};
  if (/[぀-ヿ一-鿿]/.test(raw)) {
    const x = hira(raw.replace(/[\s、。！？!?.,〜~]/g, ''));
    return {ok: x === hira((w.r || w.s)) || x === hira(w.s)};
  }
  const a = normRo(raw), b = normRo(w.ro);
  if (a === b) return {ok:true};
  if (b.length >= 5 && lev(a, b) <= 1) return {ok:true, typo:true};
  return {ok:false};
}

/* ---------- speaking ---------- */
function micErr(e) {
  const c = (e && (e.code || e.name)) || '';
  if (/NotAllowed|not-allowed|service-not-allowed|Permission/i.test(c + (e && e.message))) return 'Katana needs microphone permission. Allow it for this site in your browser settings, then try again.';
  if (/NotFound/i.test(c)) return 'No microphone was found.';
  if (/network/i.test(c)) return 'Speech recognition needs a connection. Switch checking to On-device under Me.';
  return (e && e.message) || 'Recording failed.';
}
/* Listens once. Uses the phone's recognizer when allowed, otherwise records and runs Whisper here. */
async function hearOnce({onLevel, signal, onState} = {}) {
  const useWeb = S.set.speech !== 'whisper' && ASR.hasWebSpeech();
  if (useWeb) {
    try { if (onState) onState('listen'); const alts = await ASR.webSpeech(signal); return {text:alts[0] || '', alts}; }
    catch (e) { if (!ASR.hasMic() || /aborted/.test(e.code || '')) throw e; }
  }
  if (!ASR.hasMic()) throw new Error('This browser can’t record audio.');
  if (onState) onState('listen');
  const pcm = await ASR.record({onLevel, signal});
  if (!pcm) return {text:'', alts:[]};
  if (onState) onState('think');
  if (!ASR.ready()) await ASR.load(S.set.model === 'turbo' ? 'small' : S.set.model);
  const text = await ASR.recognize(pcm, ASR.ready());
  return {text, alts:[text]};
}
/* A self-contained speaking panel: listen to the model, record yourself, see which sounds matched. */
function speakPanel(box, {jp, onDone, compact, ref}) {
  let attempts = 0, ac = null;
  const meter = h('i', {class:'lvl'});
  const status = h('p', {class:'sp-status'}, compact ? 'Tap the mic and say the line.' : 'Tap the mic, then say it.');
  const out = h('div', {class:'sp-out'});
  const mic = h('button', {class:'mic', type:'button', 'aria-label':'Start speaking'}, icon('mic'), h('span', {class:'mlvl'}, meter));
  const go = async () => {
    if (ac) { ac.abort(); return; }
    ac = new AbortController(); mic.classList.add('rec'); mic.setAttribute('aria-label', 'Stop'); out.replaceChildren();
    TTS.stop(); stopSeg();
    try {
      const r = await hearOnce({signal:ac.signal, onLevel:v => { meter.style.transform = `scaleX(${Math.min(1, .05 + v)})`; }, onState:s => { status.textContent = s === 'think' ? 'Checking…' : 'Listening… tap again when you’re done.'; }});
      attempts++;
      const best = (r.alts.length ? r.alts : [r.text]).map(t => ({t, sc:JP.score(jp, t)})).sort((a, b) => b.sc.score - a.sc.score)[0];
      if (!best || !best.t) { status.textContent = 'Nothing came through. Try again a little louder.'; return; }
      const pct = Math.round(best.sc.score * 100);
      const pass = best.sc.score >= (JP.kanaOf(jp).length <= 3 ? .67 : .75);
      status.textContent = pass ? (pct >= 90 ? 'Clear. ばっちり！' : 'Good. Close enough to be understood.') : 'Not quite. The red sounds didn’t come through.';
      out.replaceChildren(
        h('div', {class:'sp-heard'}, h('span', {class:'lbl'}, 'Heard'), h('span', {lang:'ja'}, best.t)),
        h('div', {class:'sp-marks', lang:'ja'}, best.sc.marks.map(m => h('span', {class:m.ok ? 'ok' : 'no'}, m.k))),
        h('div', {class:'sp-score' + (pass ? ' pass' : '')}, `${pct}%`));
      if (onDone) onDone({pass, score:best.sc.score, attempts});
    } catch (e) { status.textContent = micErr(e); if (onDone) onDone({error:e, attempts}); }
    finally { ac = null; mic.classList.remove('rec'); mic.setAttribute('aria-label', 'Start speaking'); meter.style.transform = ''; }
  };
  mic.onclick = go;
  box.replaceChildren(h('div', {class:'speak' + (compact ? ' compact' : '')}, h('div', {class:'sp-row'}, ref || null, mic), status, out));
  return {go};
}
R.say = (ctx, ex) => {
  ctx.speakOnly = true;
  ctx.body.append(q(ex.word ? 'Say this word' : 'Say this line'));
  let sg = null;
  if (ex.cl) { sg = clipStage(ctx, ex.cl, 'none'); }
  ctx.body.append(h('section', {class:'teach'},
    h('div', {class:ex.kana ? 'kword' : 't-jp', lang:'ja', html:ex.html}),
    ex.ro ? h('p', {class:'t-ro'}, ex.ro) : null, ex.en ? h('p', {class:'t-en'}, ex.en) : null));
  const ref = h('div', {class:'t-btns'},
    h('button', {class:'spk', type:'button', 'aria-label':'Listen'}, icon(ex.cl ? 'replay' : 'speaker')),
    h('button', {class:'spk slow', type:'button', 'aria-label':'Listen slowly'}, icon('turtle')));
  ref.children[0].onclick = () => ex.ref(false); ref.children[1].onclick = () => ex.ref(true);
  const box = h('div');
  ctx.body.append(box);
  if (!ex.cl) ex.ref(false);
  speakPanel(box, {jp:ex.jp, ref, onDone:r => {
    if (r.error) return;
    if (r.pass) setTimeout(() => ctx.auto({ok:true, hard:r.score < .9, sol:null}), 700);
    else if (r.attempts >= 2) setTimeout(() => ctx.auto({ok:false, sol:{type:'say', html:ex.html, ro:ex.ro, en:ex.en}}), 900);
  }});
};

/* ---------- start-up ---------- */
async function boot() {
  if (/[?&]debug\b/.test(location.search)) window.__k = {get lesson() { return lesson; }, S:() => S, CLIPS:() => CLIPS, render, startSession, view:() => view};
  render();
  await loadClips();
  CLIPS.forEach(c => { ensureUrl(c).catch(() => {}); });
  if (!readyClips().length) view.clipMode = 'library';
  render();
  JP.ready().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
})();
