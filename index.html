<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Katana</title>
<meta name="description" content="Learn Japanese from your own clips: on-device subtitles, tap-to-define words, speaking checks and spaced repetition.">
<meta name="theme-color" content="#F7F5FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15122A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Katana">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Katana · Layout: one-column phone app. Status bar, a scrolling main area (clip feed, lesson paths, deck), tab bar. A lesson takes the whole screen: progress bar, one exercise, a Check footer and a verdict sheet that slides up over it. */
:root{
  --bg:#F7F5FF; --surface:#FFFFFF; --surface-2:#EFEBFC; --line:#E2DCF5; --ink:#211A3D; --ink-2:#6E6694;
  --accent:#7C5CFF; --accent-deep:#5A3BDB; --accent-soft:#EFEAFF;
  --info:#5B7CFF; --info-deep:#3E5BD6; --info-soft:#E8ECFF; --info-ink:#3550C4;
  --good:#58CC02; --good-deep:#46A302; --good-soft:#E6F8D6; --good-ink:#3A8500;
  --bad:#FF4B4B; --bad-deep:#D63A3A; --bad-soft:#FFE5E5; --bad-ink:#C42B2B;
  --sub:#FFC800; --sub-deep:#DDA600; --sub-soft:#FFF5CC; --xp:#C99400; --on-sub:#3A2A00;
  --flame:#FF9600;
  --lock:#E3DEF2; --lock-deep:#CBC4E2; --lock-ink:#958DB6;
  --on-color:#FFFFFF; --subbg:#1F1940;
  --sub-text:#FFFFFF; --sub-en:#FFE14D; --sub-ro:#DCD3FF;
  --outline:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000,1.5px 1.5px 0 #000,-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000;
  --outline-thin:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000,1px 1px 0 #000,-1px -1px 0 #000;
  --f-display:"Nunito","Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Nunito","Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15122A; --surface:#211C3D; --surface-2:#2C2651; --line:#3A3366; --ink:#F2EFFF; --ink-2:#A9A1D3;
    --accent:#9D85FF; --accent-deep:#6A4EE6; --accent-soft:#30285F;
    --info:#8EA2FF; --info-deep:#5468E0; --info-soft:#262C5C; --info-ink:#C2CCFF;
    --good:#6BD62B; --good-deep:#47A51A; --good-soft:#1E3A1F; --good-ink:#9BEA6A;
    --bad:#FF6B6B; --bad-deep:#C94545; --bad-soft:#3F1E2C; --bad-ink:#FFA3A3;
    --sub:#FFCF33; --sub-deep:#C79A00; --sub-soft:#3A3216; --xp:#FFCF33; --on-sub:#3A2A00;
    --flame:#FF9F2E;
    --lock:#39325E; --lock-deep:#2A2449; --lock-ink:#8077A8; --subbg:#0F0C22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#15122A; --surface:#211C3D; --surface-2:#2C2651; --line:#3A3366; --ink:#F2EFFF; --ink-2:#A9A1D3;
    --accent:#9D85FF; --accent-deep:#6A4EE6; --accent-soft:#30285F;
    --info:#8EA2FF; --info-deep:#5468E0; --info-soft:#262C5C; --info-ink:#C2CCFF;
    --good:#6BD62B; --good-deep:#47A51A; --good-soft:#1E3A1F; --good-ink:#9BEA6A;
    --bad:#FF6B6B; --bad-deep:#C94545; --bad-soft:#3F1E2C; --bad-ink:#FFA3A3;
    --sub:#FFCF33; --sub-deep:#C79A00; --sub-soft:#3A3216; --xp:#FFCF33; --on-sub:#3A2A00;
    --flame:#FF9F2E;
    --lock:#39325E; --lock-deep:#2A2449; --lock-ink:#8077A8; --subbg:#0F0C22;
    color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;font-weight:600;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{height:100%;max-width:520px;margin-inline:auto;display:flex;flex-direction:column;position:relative;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:560px){#app{border-inline:2px solid var(--line)}}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
h1,h2,h3,p{margin:0}
ruby rt{font-weight:700}
.muted{color:var(--ink-2)}
.ic{display:inline-flex;width:22px;height:22px;flex:none}
.ic svg{width:100%;height:100%}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.h1{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1.2;text-wrap:balance}
.lbl{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.logo{font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1;color:var(--accent)}
.brand-t{font-weight:900;font-size:12px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
@media (max-width:380px){.brand-t{display:none}}
.stats{display:flex;gap:14px}
.stat{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-variant-numeric:tabular-nums;font-size:15px}
.stat .ic{width:20px;height:20px}
.stat.streak{color:var(--lock-ink)}
.stat.streak.lit{color:var(--flame)}
.stat.xp{color:var(--xp)}
.stat.hp{color:var(--bad)}

/* scroll areas */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;overscroll-behavior:contain}
.pad{padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px}

/* tab bar */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;border-top:2px solid var(--line);padding:6px 6px}
.tab{background:none;border:0;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:900;color:var(--ink-2);letter-spacing:.02em}
.tab.on{color:var(--accent);background:var(--accent-soft)}
.tab-ic{position:relative;display:inline-flex}
.badge{position:absolute;top:-6px;right:-12px;background:var(--accent);color:var(--on-color);font-size:10px;line-height:16px;border-radius:99px;padding:0 5px;min-width:16px;text-align:center;font-variant-numeric:tabular-nums}

/* buttons */
.btn{appearance:none;border:0;border-radius:14px;padding:12px 18px;font-weight:900;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--on-color);box-shadow:0 4px 0 var(--accent-deep);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 transparent}
.btn:disabled{background:var(--surface-2);color:var(--lock-ink);box-shadow:0 4px 0 var(--line)}
.btn.wide{width:100%}
.btn.good{background:var(--good);box-shadow:0 4px 0 var(--good-deep)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-deep)}
.btn.info{background:var(--info);box-shadow:0 4px 0 var(--info-deep)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn .ic{width:20px;height:20px}
.btn-text{background:none;border:0;color:var(--ink-2);font-weight:900;text-transform:uppercase;letter-spacing:.08em;padding:12px;font-size:14px}
.btn-text.bad{color:var(--bad-ink)}

/* learn path */
.goal{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal-n{font-weight:900;font-variant-numeric:tabular-nums}
.goal-msg{font-size:14px;color:var(--ink-2)}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sub);border-radius:inherit;transition:width .4s}
.season{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:var(--r);color:var(--on-color);background:var(--accent);box-shadow:0 4px 0 var(--accent-deep);margin-top:8px}
.season.s2{background:var(--info);box-shadow:0 4px 0 var(--info-deep)}
.season .eyebrow{color:inherit;opacity:.85}
.season h2{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1.15;margin-top:2px}
.season p{font-weight:700;font-size:14px;opacity:.92}
.ghost-btn{display:inline-flex;gap:6px;align-items:center;border:2px solid rgba(255,255,255,.65);background:transparent;color:inherit;border-radius:12px;padding:8px 10px;font-weight:900;font-size:13px;letter-spacing:.04em;text-transform:uppercase;flex:none}
.ghost-btn .ic{width:18px;height:18px}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:28px 30px}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x))}
.node{position:relative;width:74px;height:70px;border-radius:50%;border:0;background:var(--accent);color:var(--on-color);box-shadow:0 7px 0 var(--accent-deep);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--accent-deep)}
.path.s2 .node{background:var(--info);box-shadow:0 7px 0 var(--info-deep)}
.path .node.recap{border-radius:22px;background:var(--sub);box-shadow:0 7px 0 var(--sub-deep);color:var(--on-sub)}
.path .node.lock{background:var(--lock);box-shadow:0 7px 0 var(--lock-deep);color:var(--lock-ink)}
.nwrap.is-cur .node::before{content:"";position:absolute;inset:-10px -10px -17px;border-radius:inherit;border:4px solid currentColor;opacity:.0;animation:ring 1.8s ease-out infinite}
.nwrap.is-cur .node{color:var(--on-color)}
.nwrap.is-cur .node.recap{color:var(--on-sub)}
.nwrap.is-cur .node::before{border-color:var(--accent)}
.path.s2 .nwrap.is-cur .node::before{border-color:var(--info)}
@keyframes ring{0%{opacity:.6;transform:scale(.92)}100%{opacity:0;transform:scale(1.18)}}
.cue{position:absolute;bottom:calc(100% + 12px);background:var(--surface);border:2px solid var(--line);color:var(--accent);font-weight:900;font-size:13px;letter-spacing:.1em;padding:5px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.cue::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.pips{display:flex;gap:4px;margin-top:6px}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--lock)}
.pips i.on{background:var(--sub)}
.ep{font-size:12px;font-weight:900;color:var(--ink-2);letter-spacing:.04em}
.pop{width:100%;max-width:360px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;position:relative;margin-top:-4px}
.pop::before{content:"";position:absolute;top:-9px;left:calc(50% + var(--x) - 8px);width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:rotate(45deg)}
.pop h3{font-size:20px;line-height:1.25}
.pop .btn{margin-top:6px}
.pop-jp{font-weight:700}

/* lesson shell */
.lesson{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 16px 6px}
.icon-btn{background:none;border:0;color:var(--ink-2);padding:6px;border-radius:10px;display:grid;place-items:center}
.prog{height:16px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;min-width:16px;background:var(--accent);border-radius:99px;position:relative;transition:width .35s ease}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.lbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 16px 24px;display:flex;flex-direction:column;gap:14px}
.lfoot{display:flex;gap:10px;padding:14px 16px;border-top:2px solid var(--line)}
.lfoot .btn{flex:1}
.lfoot .btn.ghost{flex:0 1 auto;font-size:13px;padding-inline:12px}
.locked .opt,.locked .tile,.locked .m,.locked .type-in{pointer-events:none}
.q{font-family:var(--f-body);font-weight:900;font-size:22px;line-height:1.3;text-wrap:balance}
.qwrap{display:grid;gap:4px}
.qsub{color:var(--ink-2);font-size:14px}

/* the scene frame */
.frame{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:0;box-shadow:0 6px 18px rgba(40,20,90,.18);background:#0B0B14;flex:none}
.frame>svg{position:absolute;inset:0;width:100%;height:100%;display:block;animation:kb 18s ease-in-out infinite alternate;transform-origin:50% 35%}
@keyframes kb{to{transform:scale(1.07)}}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}
.tc,.trk{font-size:11px;font-weight:900;letter-spacing:.06em;color:#FFFFFF;background:rgba(10,10,20,.58);padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums;display:inline-flex;gap:8px}
.tc-t{opacity:.8}
.subs{position:absolute;left:6px;right:6px;bottom:7px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.who{font-size:11px;font-weight:900;color:#FFFFFF;background:rgba(10,10,20,.62);border-radius:99px;padding:1px 9px 1px 7px;display:inline-flex;align-items:center;gap:5px;margin-bottom:1px}
.who::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.s-jp{font-size:clamp(18px,5.6vw,26px);font-weight:900;color:var(--sub-text);line-height:1.7;text-shadow:var(--outline);letter-spacing:.03em}
.s-jp rt{font-size:.48em;font-weight:900}
.s-ro{font-size:clamp(11px,3.2vw,13px);font-weight:700;color:var(--sub-ro);text-shadow:var(--outline-thin);line-height:1.3}
.s-en{font-size:clamp(12px,3.6vw,15px);font-weight:700;color:var(--sub-en);text-shadow:var(--outline-thin);line-height:1.3}
.blank{display:inline-block;min-width:2.4em;height:1.05em;border-bottom:3px solid var(--sub-en);vertical-align:-.12em;margin-inline:.1em}
.blank.filled{min-width:0;height:auto;border-bottom-style:dashed;color:var(--sub-en);vertical-align:baseline}
.tk{border-bottom:2px dotted currentColor;cursor:pointer}
.playov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,8,22,.38);border:0;color:#FFFFFF;font-weight:900;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.pv-ic{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#FFFFFF;display:grid;place-items:center;box-shadow:0 5px 0 var(--accent-deep)}
.pv-ic .ic{width:30px;height:30px;margin-left:4px}
.frame .fall path{animation:fall .9s linear infinite}
@keyframes fall{to{stroke-dashoffset:-36}}
.frame .steam path{animation:steam 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.frame .steam path:nth-child(2){animation-delay:-1s}
.frame .steam path:nth-child(3){animation-delay:-2s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.75}100%{opacity:0;transform:translateY(-14px)}}
.frame .fw{animation:burst 2.8s ease-out infinite;transform-box:view-box;opacity:0}
@keyframes burst{0%{opacity:0;transform:scale(.25)}12%{opacity:1}70%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
.frame .petal{fill:#FF9EC0;animation:petal 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes petal{from{transform:translate(0,-110px) rotate(0)}to{transform:translate(-40px,110px) rotate(540deg)}}
.frame .speed{transform-box:view-box;transform-origin:160px 78px;animation:jit .24s steps(2) infinite}
@keyframes jit{50%{transform:scale(1.025) rotate(.5deg)}}
.frame .zoom{animation:zoom 1.2s linear infinite}
@keyframes zoom{from{transform:translateX(30px);opacity:0}30%{opacity:.5}to{transform:translateX(-60px);opacity:0}}

/* watch + teach */
.ep-head{display:grid;gap:2px}
.ep-title{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1.15;text-wrap:balance}
.ep-jp{font-weight:700;font-size:14px}
.tracks{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:2px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:5px 12px;font-weight:900;font-size:13px}
.chipbtn[aria-pressed="true"]{border-color:var(--info);background:var(--info-soft);color:var(--info-ink)}
.script{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.script-row{width:100%;text-align:left;display:grid;gap:1px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:9px 12px;color:var(--ink)}
.script li.on .script-row{border-color:var(--accent);background:var(--accent-soft)}
.who-n{font-size:12px;font-weight:900;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;letter-spacing:.03em}
.who-n::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-2))}
.sjp{font-size:18px;font-weight:700;line-height:1.85}
.sen{font-size:14px;color:var(--ink-2)}
.eyebrow.new{color:var(--accent)}
.teach{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.t-jp{min-width:0;font-size:26px;font-weight:900;line-height:1.75;margin-bottom:-6px}
.t-btns{display:flex;gap:8px;flex:none;padding-bottom:4px}
.t-ro{color:var(--ink-2);font-weight:700}
.t-en{font-size:18px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:grid;justify-items:center;background:var(--bg);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:5px 10px 7px;color:var(--ink);min-width:64px}
.chip.gram{border-style:dashed}
.c-jp{font-size:20px;font-weight:900;line-height:1.65}
.c-ro{font-size:12px;color:var(--ink-2);font-weight:700}
.c-g{font-size:12px;font-weight:700;color:var(--info-ink);max-width:128px;text-align:center;line-height:1.3}
.note{background:var(--sub-soft);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.note-l{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--xp)}
.note p{font-size:15px}

/* audio buttons */
.spk{width:44px;height:44px;border-radius:12px;border:0;background:var(--info);color:var(--on-color);box-shadow:0 4px 0 var(--info-deep);display:grid;place-items:center;flex:none;transition:transform .06s,box-shadow .06s}
.spk:active{transform:translateY(4px);box-shadow:0 0 0 transparent}
.spk.slow{background:var(--surface);color:var(--info-ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.spk.big{width:104px;height:104px;border-radius:24px}
.spk.big .ic{width:46px;height:46px}
.spk.sm{width:38px;height:38px;border-radius:10px;box-shadow:0 3px 0 var(--info-deep)}
.spk.sm .ic{width:20px;height:20px}
.arow{display:flex;align-items:center;gap:10px}
.arow .help{font-size:13px;color:var(--ink-2);line-height:1.3}
.bigaudio{display:flex;justify-content:center;align-items:flex-end;gap:14px;padding-block:10px}
.bigaudio .spk.slow{width:64px;height:64px;border-radius:18px}
.bigaudio .spk.slow .ic{width:30px;height:30px}

/* prompts */
.say{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:52px;height:52px;border-radius:16px;background:var(--c);color:#FFFFFF;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:24px}
.say-text{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 14px 10px;font-size:18px;font-weight:700;display:grid;gap:0;min-width:0}
.say-text::before{content:"";position:absolute;left:-9px;top:16px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.wordcard{display:flex;align-items:center;justify-content:center;gap:16px;padding:18px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r)}
.wc-jp{font-size:40px;font-weight:900;line-height:1.5}
.wc-ro{font-size:14px;color:var(--ink-2);font-weight:700;text-align:center}
.type-g{font-size:22px;font-weight:900}
.type-in{width:100%;font:inherit;font-size:18px;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);min-height:54px}
.type-in:focus{border-color:var(--info);outline:none}

/* choices */
.opts{display:grid;gap:10px}
.opts.grid{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:11px 14px;font-size:16px;font-weight:700;color:var(--ink);min-height:54px;min-width:0}
.opts.jp .ot{font-size:19px;line-height:1.8}
.opts.grid .opt{justify-content:center}
.opts.grid .key{display:none}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--ink-2);font-weight:900}
.ot{min-width:0}
.opt.sel{border-color:var(--info);background:var(--info-soft);color:var(--info-ink)}
.opt.sel .key{border-color:var(--info);color:var(--info-ink)}

/* word tiles */
.answer{min-height:112px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding-top:4px;background-image:repeating-linear-gradient(to bottom,transparent 0 52px,var(--line) 52px 54px)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding-top:6px}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:5px 12px;font-size:19px;font-weight:700;color:var(--ink);min-height:46px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.35}
.tile small{font-size:11px;color:var(--ink-2);font-weight:700;line-height:1.2}
.tile.en{font-size:16px}
.tile.ghost{background:var(--surface-2);border-color:var(--surface-2);color:transparent;pointer-events:none}
.tile.ghost small,.tile.ghost rt{color:transparent}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:10px;min-width:0;align-content:start}
.m{min-height:60px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:6px 8px;color:var(--ink);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;min-width:0;overflow-wrap:anywhere;transition:opacity .3s}
.m.l{font-size:20px;font-weight:900;line-height:1.5}
.m small{font-size:11px;color:var(--ink-2)}
.m.sel{border-color:var(--info);background:var(--info-soft);color:var(--info-ink)}
.m.ok{border-color:var(--good);background:var(--good-soft);color:var(--good-ink);animation:pop .3s}
.m.ok:disabled{opacity:.45}
.m.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink);animation:shake .35s}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* verdict sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 14px;display:grid;gap:12px;transform:translateY(105%);transition:transform .22s ease-out;z-index:5}
.sheet.in{transform:none}
.sheet.ok{background:var(--good-soft);color:var(--good-ink)}
.sheet.no{background:var(--bad-soft);color:var(--bad-ink)}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--on-color);flex:none}
.sheet.ok .sh-ic{background:var(--good)}
.sheet.no .sh-ic{background:var(--bad)}
.sh-ic .ic{width:24px;height:24px}
.sh-t{font-weight:900;font-size:21px;line-height:1.2}
.sh-t span{font-family:var(--f-display);font-weight:900;margin-right:6px}
.sh-combo{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.sol{display:grid;gap:2px}
.sol-l{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.sol-row{display:flex;gap:10px;align-items:center}
.sol-jp{font-size:21px;font-weight:900;line-height:1.75}
.sol-en{font-size:18px;font-weight:900}
.sol-sub{font-size:14px;font-weight:700;opacity:.9}

/* hint bubble */
.hint{position:fixed;z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:7px 12px 8px;display:grid;font-size:13px;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.22);pointer-events:none;line-height:1.35}
.hint b{font-size:18px}
.hint-g{font-weight:700}

/* episode complete */
.done{display:grid;gap:16px;justify-items:center;text-align:center;padding-top:14px}
.tbc{display:inline-grid;justify-items:center;padding:14px 24px 10px;background:var(--ink);color:var(--bg);border-radius:6px;transform:rotate(-3deg);box-shadow:6px 6px 0 var(--accent);animation:tbc .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes tbc{from{transform:translateX(-40%) rotate(-3deg);opacity:0}}
.tbc-jp{font-family:var(--f-display);font-weight:900;font-size:50px;line-height:1;letter-spacing:.08em}
.tbc-en{font-size:11px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;margin-top:8px}
.done-t{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.2;text-wrap:balance}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stile{border:2px solid var(--t);border-radius:14px;overflow:hidden;display:grid;background:var(--surface)}
.st-l{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;color:var(--tl,var(--on-color));background:var(--t)}
.st-v{font-size:24px;font-weight:900;padding:8px;font-variant-numeric:tabular-nums}
.stile.sub{--t:var(--sub);--tl:var(--on-sub)}
.stile.good{--t:var(--good)}
.stile.info{--t:var(--info)}
.stile.accent{--t:var(--accent)}
.streakline{display:inline-flex;align-items:center;gap:6px;font-weight:900;color:var(--flame)}
.yokoku{width:100%;text-align:left;border:2px dashed var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px}
.yokoku h3{font-size:18px;line-height:1.3}
.yokoku p{color:var(--ink-2);font-size:15px}
.nohp{display:grid;gap:12px;justify-items:center;text-align:center;padding-top:28px}
.nohp>.ic{width:84px;height:84px;color:var(--lock)}
.nohp h2{font-family:var(--f-display);font-weight:900;font-size:26px}

/* modal */
.modal{position:absolute;inset:0;background:rgba(10,12,30,.5);display:flex;align-items:flex-end;z-index:20}
.modal-card{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:22px 16px 14px;display:grid;gap:10px;text-align:center}
.modal-card h3{font-size:20px}
.modal-card p{color:var(--ink-2)}

/* review, phrases, me */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.rev-top{display:flex;align-items:flex-end;gap:12px}
.rev-n{font-family:var(--f-display);font-weight:900;font-size:56px;line-height:.95;color:var(--accent);font-variant-numeric:tabular-nums}
.rev-l{font-weight:900;line-height:1.3;padding-bottom:4px}
.boxes{display:grid;gap:8px}
.bx{display:grid;grid-template-columns:76px 1fr 30px;align-items:center;gap:10px;font-size:13px;font-weight:700}
.bx .track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bx .track i{display:block;height:100%;background:var(--good);border-radius:inherit}
.bx span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--ink-2)}
.ph-list{display:grid;gap:8px}
.ph-scene{font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-top:8px}
.ph-row{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:2px solid var(--line);border-radius:14px}
.ph-txt{flex:1;min-width:0;display:grid}
.ph-jp{font-size:18px;font-weight:700;line-height:1.8}
.ph-ro{font-size:13px;color:var(--ink-2)}
.ph-en{font-size:14px}
.str{display:flex;gap:2px;align-items:flex-end;flex:none;padding-top:10px;height:28px}
.str i{width:4px;border-radius:2px;background:var(--surface-2)}
.str i.on{background:var(--good)}
.search{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
.search:focus{border-color:var(--info);outline:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 8px;font-weight:900;color:var(--ink-2);font-size:14px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.empty{display:grid;gap:10px;justify-items:center;text-align:center;padding:28px 8px}
.big-k{font-family:var(--f-display);font-weight:900;font-size:72px;line-height:1;color:var(--lock)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sg{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;background:var(--surface)}
.sg .ic{width:28px;height:28px}
.sg b{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.sg small{color:var(--ink-2);font-weight:700;font-size:12px}
.sg.f .ic{color:var(--flame)} .sg.x .ic{color:var(--xp)} .sg.w .ic{color:var(--info)} .sg.l .ic{color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.day{display:grid;gap:4px;justify-items:center;font-size:12px;font-weight:900;color:var(--ink-2)}
.day i{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-style:normal;color:var(--on-color)}
.day i .ic{width:18px;height:18px}
.day.on i{background:var(--flame)}
.day.today i{outline:3px solid var(--accent);outline-offset:2px}
.rows{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:0 14px}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--surface-2)}
.row:last-child{border-bottom:0}
.row-t{flex:1;display:grid;min-width:0}
.row-t small{color:var(--ink-2);font-size:13px;line-height:1.35}
.row input[type=checkbox]{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--lock);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.row input:checked+.sw{background:var(--good)}
.row input:checked+.sw::after{transform:translateX(20px)}
.row input:focus-visible+.sw{outline:3px solid var(--info);outline-offset:2px}
.row.col{flex-direction:column;align-items:stretch;gap:8px}
input[type=range]{accent-color:var(--accent);width:100%}
.rate-v{font-weight:900;font-variant-numeric:tabular-nums}
.warn{background:var(--sub-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.inline-btns{display:flex;gap:10px;flex-wrap:wrap}
.inline-btns .btn{flex:1}

/* katakana */
.node.two{font-size:21px;letter-spacing:-.04em}
.bar.good i{background:var(--good)}
.genko{position:relative;width:132px;height:132px;border:2px solid var(--line);border-radius:14px;background:var(--surface);display:grid;place-items:center;flex:none}
.genko::before,.genko::after{content:"";position:absolute;border:0 dashed var(--line)}
.genko::before{left:50%;top:8px;bottom:8px;border-left-width:2px}
.genko::after{top:50%;left:8px;right:8px;border-top-width:2px}
.genko span{position:relative;z-index:1;font-size:88px;line-height:1;font-weight:500;color:var(--ink)}
.genko.two span{font-size:54px;letter-spacing:-.08em}
.genko.sm{width:76px;height:76px;border-radius:12px}
.genko.sm::before{top:5px;bottom:5px}.genko.sm::after{left:5px;right:5px}
.genko.sm span{font-size:50px}
.genko.sm.two span{font-size:31px}
.kcenter{display:flex;justify-content:center;padding-block:4px}
.kdetail{display:flex;gap:16px;align-items:center}
.kd-side{display:grid;gap:8px;justify-items:start;min-width:0}
.k-ro{font-size:32px;font-weight:900;line-height:1.1}
.conf{background:var(--bad-soft);color:var(--bad-ink);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700}
.conf b{font-size:19px;font-weight:500}
.kex{display:grid;gap:6px}
.kex-row{display:flex;align-items:baseline;gap:10px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px 12px;color:var(--ink);text-align:left;flex-wrap:wrap}
.kex-row b{font-size:22px;font-weight:500}
.kex-row span{font-size:14px;color:var(--ink-2)}
.krow{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;justify-items:center}
.kcell-t{display:grid;justify-items:center;gap:4px;background:none;border:0;padding:0;color:var(--ink)}
.kcell-t b{font-size:16px;font-weight:900}
.knotes{display:grid;gap:2px}
.kprompt{font-size:34px;font-weight:900;line-height:1.2;text-align:center}
.kprompt-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r)}
.kprompt-card .kprompt{text-align:left;font-size:28px}
.kword{font-size:44px;font-weight:500;line-height:1.3;letter-spacing:.04em;overflow-wrap:anywhere}
.opts.kana .ot{font-size:34px;font-weight:500;line-height:1.2}
.opts.kana:not(.grid) .ot{font-size:26px;letter-spacing:.04em}
.opts.ro .ot{font-size:22px;font-weight:900}
.tile.kana{font-size:24px;font-weight:500;min-width:46px}
.m.kana{font-size:28px;font-weight:500}
.sol-kana{font-size:32px;font-weight:500;line-height:1.25}
.kanarow{font-size:24px;font-weight:500}
.kchart{display:grid;gap:8px}
.chart{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chart.c3{grid-template-columns:repeat(3,1fr)}
.kc{position:relative;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:5px 2px 8px;display:grid;justify-items:center;color:var(--ink);overflow:hidden;min-width:0}
.kc b{font-size:22px;font-weight:500;line-height:1.25}
.kc small{font-size:11px;color:var(--ink-2);font-weight:700}
.kc::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:calc(var(--s,0) * 100%);background:var(--good)}
.kc.new{background:var(--surface-2);border-color:var(--surface-2);color:var(--lock-ink)}
.kc.new small{color:var(--lock-ink)}
.kc.master{border-color:var(--good)}
.kc.sel{outline:3px solid var(--info);outline-offset:1px}
.kc-empty{visibility:hidden}
.sg.k .ic{color:var(--good)} .sg.kw .ic{color:var(--info)}
@media (max-width:360px){.tab{font-size:11px}}

/* ---------- Katana additions ---------- */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:min(92vw,460px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.btn .ic{width:20px;height:20px}
.chip-s{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);width:max-content;max-width:100%}
.chip-s.good{background:var(--good-soft);color:var(--good-ink)}
.chip-s.info{background:var(--info-soft);color:var(--info-ink)}
.welcome{gap:12px}
.welcome .h1{font-size:24px}
.cseg{max-width:260px;margin-inline:auto;width:100%}
.clist{display:grid;gap:10px}
.ccard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--r);padding:8px;color:var(--ink);min-width:0}
.cthumb{position:relative;flex:none;width:112px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#0B0B14;display:grid;place-items:center;color:#FFFFFF}
.cthumb img{width:100%;height:100%;object-fit:cover;display:block}
.cdur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.7);color:#FFFFFF;font-size:11px;font-weight:900;border-radius:5px;padding:0 5px;font-variant-numeric:tabular-nums}
.cinfo{display:grid;gap:4px;min-width:0}
.cinfo b{font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.job{background:var(--info-soft);color:var(--info-ink);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.job.err{background:var(--bad-soft);color:var(--bad-ink)}
.job-t{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.job .bar i{background:var(--info)}
.job .small{color:inherit}
.backbtn{background:none;border:0;color:var(--info-ink);font-weight:900;font-size:15px;padding:4px 0;justify-self:start;align-self:flex-start}
.dtitle{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dtitle .h1{min-width:0;overflow-wrap:anywhere}
.renamef{display:flex;gap:8px}
.renamef .btn{min-height:46px}
.dacts{display:grid;gap:10px}
/* video stages */
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:0;box-shadow:0 6px 18px rgba(40,20,90,.18);background:#0B0B14;flex:none}
.stage .vposter{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.7) brightness(.55)}
.vslot{position:absolute;inset:0}
.vslot.mini{position:relative;inset:auto;width:0;height:0}
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent}
.vslot.mini .vid{width:1px;height:1px;opacity:0}
.tapplay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,8,22,.4);border:0;color:#FFFFFF;font-weight:900;font-size:14px;letter-spacing:.08em;text-transform:uppercase;z-index:2}
.lbody>*{flex-shrink:0}
.tile .tl{display:block}
.vsubs{background:var(--subbg);border-radius:16px;padding:10px 12px;display:grid;gap:2px;text-align:center}
.vsubs.hide{display:none}
.vsubs.empty{min-height:56px}
.vsubs .s-jp{font-size:clamp(19px,5.6vw,25px);line-height:1.75}
.vsubs .s-ro{font-size:13px}
.vsubs .s-en{font-size:15px}
.livesubs .vsubs{min-height:64px}
.tline.on .script-row{border-color:var(--accent);background:var(--accent-soft)}
/* speaking */
.speak{display:grid;justify-items:center;gap:10px;padding-block:6px}
.sp-row{display:flex;align-items:center;gap:14px}
.mic{position:relative;width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--on-color);box-shadow:0 6px 0 var(--accent-deep);display:grid;place-items:center;transition:transform .06s,box-shadow .06s}
.mic .ic{width:38px;height:38px}
.mic:active{transform:translateY(5px);box-shadow:0 1px 0 var(--accent-deep)}
.mic.rec{background:var(--bad);box-shadow:0 6px 0 var(--bad-deep);animation:recpulse 1.2s ease-in-out infinite}
@keyframes recpulse{50%{box-shadow:0 6px 0 var(--bad-deep),0 0 0 10px var(--bad-soft)}}
.mlvl{position:absolute;left:50%;bottom:-16px;width:64px;height:6px;transform:translateX(-50%);background:var(--surface-2);border-radius:3px;overflow:hidden}
.lvl{display:block;height:100%;width:100%;background:var(--good);transform-origin:left;transform:scaleX(0);transition:transform .08s linear}
.speak.compact .mic{width:64px;height:64px}
.speak.compact .mic .ic{width:30px;height:30px}
.sp-status{font-weight:700;color:var(--ink-2);text-align:center;margin-top:8px}
.sp-out{display:grid;justify-items:center;gap:6px}
.sp-out:empty{display:none}
.sp-heard{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;justify-content:center;font-size:18px}
.sp-marks{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.sp-marks span{font-size:20px;font-weight:700;padding:1px 5px;border-radius:7px}
.sp-marks .ok{background:var(--good-soft);color:var(--good-ink)}
.sp-marks .no{background:var(--bad-soft);color:var(--bad-ink)}
.sp-score{font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--bad-ink)}
.sp-score.pass{color:var(--good-ink)}
.teach .kword{font-size:40px}
/* word sheet */
.wsheet{position:fixed;left:50%;bottom:0;width:min(100%,520px);transform:translate(-50%,105%);transition:transform .2s ease-out;z-index:55;background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -8px 30px rgba(0,0,0,.22);padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:70vh;overflow:auto}
.wsheet.in{transform:translate(-50%,0)}
.ws-grab{width:44px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.ws-head{display:flex;align-items:center;gap:12px}
.ws-w{font-size:34px;font-weight:900;line-height:1.6}
.ws-side{flex:1;min-width:0;display:grid}
.ws-ro{font-weight:700;color:var(--ink-2)}
.ws-pos{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--info-ink)}
.ws-body{display:grid;gap:6px}
.ws-g{font-size:17px;font-weight:700}
/* review */
.rev-top{display:flex;gap:24px;align-items:flex-end}
.rev-col{display:grid}
.rev-n.new{color:var(--info)}
.bx .track i.unseen{background:var(--lock)}
.row-l{font-size:13px;font-weight:900;color:var(--ink-2)}
.row.radio{gap:12px}
.row.radio input{position:absolute;opacity:0;width:1px;height:1px}
.rdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.row.radio input:checked+.rdot{border-color:var(--accent)}
.row.radio input:checked+.rdot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.row.radio input:focus-visible+.rdot{outline:3px solid var(--info);outline-offset:2px}
.about summary{font-weight:900;color:var(--ink-2);cursor:pointer;padding:6px 0}
.wctx{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px}
.wctx-top{display:flex;align-items:center;gap:8px}
.wctx-jp{font-size:17px;line-height:1.8}
.inline-btns .btn{min-width:0}
@media (max-width:360px){.frail small{display:none}}


/* ---------- Cards: video on top, the line word by word, definitions, Back / Next / Save ---------- */
.scroll.feedmode{overflow:hidden;display:flex;flex-direction:column}
.fhost{flex:1;min-height:0;display:flex}
.fpage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;padding:8px 16px 14px}
.fpage.from-next{animation:pgnext .26s ease-out}
.fpage.from-prev{animation:pgprev .26s ease-out}
@keyframes pgnext{from{opacity:0;transform:translateY(24px)}}
@keyframes pgprev{from{opacity:0;transform:translateY(-24px)}}
.fhead{display:flex;align-items:center;gap:12px;flex:none;min-height:40px}
.fhead .icon-btn{margin-left:-6px}
.fprog{flex:1;height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fprog i{display:block;height:100%;min-width:14px;border-radius:inherit;background:var(--accent);position:relative;transition:width .3s}
.fprog i::after{content:"";position:absolute;left:7px;right:7px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.32)}
.fcount{font-size:14px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage.fstage{flex:0 1 42%;min-height:150px;aspect-ratio:auto;border-radius:24px}
.fstage.fill .vid,.fstage .vposter{object-fit:cover;filter:none}
.orail{position:absolute;right:10px;top:10px;display:grid;gap:8px;z-index:3}
.obtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(18,12,40,.42);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:0;color:#FFFFFF;transition:background .15s}
.obtn .ic{width:20px;height:20px}
.obtn.on{background:var(--accent)}
.ometa{position:absolute;left:14px;right:64px;bottom:10px;z-index:2;color:#FFFFFF;font-size:12px;font-weight:700;opacity:.9;pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.fmid{flex:1 1 0;min-height:140px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;margin-inline:-4px;padding:0 4px 4px;scrollbar-width:none}
.fmid::-webkit-scrollbar{display:none}
.fmid{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%);padding-top:6px}
.fmid>*{flex-shrink:0}

/* the line, word by word */
.subcard{position:relative;flex:none;padding:6px 44px 2px;text-align:center;display:grid;gap:8px}
.subcard.hidden{padding:0}
.expbtn{position:absolute;top:2px;right:0;width:36px;height:36px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.expbtn .ic{width:18px;height:18px}
.expbtn:active{transform:scale(.94)}
.wline{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:10px 6px;font-size:clamp(23px,6.6vw,29px);font-weight:700;line-height:1.3}
.wline ruby rt{font-size:.42em;font-weight:700;color:var(--ink-2)}
.wu{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;-webkit-user-select:none;user-select:none;border-radius:10px}
.wu:focus-visible{outline-offset:4px}
.wu-ro{font-family:var(--f-body);font-size:12.5px;font-weight:800;color:var(--accent);line-height:1.2;margin-bottom:2px;white-space:nowrap}
.wu-jp{position:relative;padding:0 3px 7px;line-height:1.5;transition:color .12s}
.wu-jp::after{content:"";position:absolute;left:3px;right:3px;bottom:0;height:3px;border-radius:3px;background:var(--line);transition:background .12s}
.wu.g .wu-jp{color:var(--ink-2)}
.wu.g .wu-ro{color:var(--ink-2);opacity:.8}
.wu.g .wu-jp::after{background:var(--surface-2)}
.wu.on .wu-jp,.wu.on .wu-ro{color:var(--accent);opacity:1}
.wu.on .wu-jp::after{background:var(--accent)}
.wu.say .wu-jp{animation:sayp .5s ease-in-out infinite alternate}
@keyframes sayp{to{transform:translateY(-2px)}}
.wu.p{cursor:default;margin-left:-6px}
.wu.p .wu-jp{padding-inline:0}
.wu.p .wu-jp::after{display:none}
.wu.sp{width:.2em}
.wl-en{font-size:16px;font-weight:700;line-height:1.4;color:var(--ink-2);text-wrap:balance}
.subcard .reveal{width:100%;border:2px dashed var(--line);background:transparent;border-radius:16px;padding:16px;color:var(--ink-2);font-weight:800;font-size:15px}

/* definitions: one list, tap a row to hear the word, › explains it */
.defs{flex:none;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:4px 0;display:grid}
.defs>.lbl{padding:10px 16px 4px}
.deflist{display:grid}
.defrow{position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-top:2px solid var(--surface-2);touch-action:pan-y;--dx:0px;--p:0}
.deflist .defrow:first-child{border-top:0}
.dslide{position:relative;z-index:1;display:flex;align-items:stretch;background:var(--surface);transform:translateX(var(--dx));transition:transform .22s cubic-bezier(.2,.9,.3,1.2),background .12s}
.defrow.dragging .dslide{transition:none}
.defrow.on .dslide{background:var(--accent-soft)}
.dbg{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 20px;font-weight:900;font-size:15px;letter-spacing:.02em;color:#FFFFFF;opacity:0}
.dbg .ic{width:22px;height:22px}
.dbg.know{background:var(--good);justify-content:flex-start}
.dbg.again{background:var(--bad);justify-content:flex-end}
.defrow[data-dir="r"] .dbg.know,.defrow[data-dir="l"] .dbg.again{opacity:calc(.35 + var(--p) * .65)}
.defrow.marked-k .dslide{animation:mk .7s ease-out}
.defrow.marked-a .dslide{animation:ma .7s ease-out}
@keyframes mk{0%{background:var(--good-soft)}}
@keyframes ma{0%{background:var(--bad-soft)}}
.dstate{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;width:max-content;max-width:100%}
.dstate .ic{width:14px;height:14px}
.dstate.known{color:var(--good-ink)}
.dstate.again{color:var(--bad-ink)}
.dhint{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 16px 6px;padding:6px 12px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:800}
.dhint span:first-child{color:var(--bad-ink)}
.dhint span:last-child{color:var(--good-ink)}
.dmain{flex:1;min-width:0;display:grid;grid-template-columns:minmax(76px,max-content) 1fr;align-items:center;gap:14px;background:none;border:0;padding:10px 4px 10px 16px;text-align:left;color:var(--ink)}
.dw{display:grid;justify-items:start;max-width:44vw}
.dw small{font-size:12px;font-weight:800;color:var(--accent);line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dw b{font-size:21px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
.dw b rt{font-size:.5em;color:var(--ink-2)}
.defrow.g .dw b,.defrow.g .dw small{color:var(--ink-2)}
.defrow.say .dw b{color:var(--accent)}
.dm{display:grid;gap:5px;min-width:0}
.dm-t{font-size:15.5px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.dtags{display:flex;flex-wrap:wrap;gap:4px}
.dtags i{font-style:normal;font-size:11.5px;font-weight:800;line-height:1.6;background:var(--info-soft);color:var(--info-ink);padding:0 8px;border-radius:99px}
.dmore{flex:none;width:44px;background:none;border:0;color:var(--lock-ink);display:grid;place-items:center}
.dmore .ic{width:18px;height:18px}
.dmore:active{color:var(--accent)}

/* word cards: a stack you swipe, Anki style */
.wdcard .wd-row{display:flex;align-items:center;gap:12px}
.wd-ic{flex:none;width:52px;height:52px;border-radius:16px;background:var(--accent);color:#FFFFFF;display:grid;place-items:center;font-size:26px;font-weight:900;box-shadow:0 4px 0 var(--accent-deep)}
.wdeck{gap:0}
.wd-top{display:flex;align-items:center;gap:12px;padding:10px 16px}
.wstack{flex:1;min-height:0;position:relative;margin:8px 20px 0;display:grid}
.wcard{grid-area:1/1;position:relative;z-index:2;align-self:stretch;max-height:520px;border-radius:28px;background:var(--surface);border:2px solid var(--line);border-bottom-width:6px;touch-action:pan-y;cursor:grab;--dx:0px;--p:0;transform:translateX(var(--dx)) rotate(calc(var(--dx) / 22));transition:transform .25s cubic-bezier(.2,.9,.3,1.2);perspective:1200px;-webkit-user-select:none;user-select:none}
.wcard.dragging{transition:none;cursor:grabbing}
.wcard.flying{transition:transform .22s ease-in}
.wcard.under{z-index:1;transform:translateY(10px) scale(.95);opacity:.7;pointer-events:none}
.wcard[data-dir="r"]{border-color:color-mix(in srgb,var(--good) calc(var(--p) * 100%),var(--line))}
.wcard[data-dir="l"]{border-color:color-mix(in srgb,var(--bad) calc(var(--p) * 100%),var(--line))}
.stamp{position:absolute;top:22px;z-index:3;padding:4px 12px;border:3px solid currentColor;border-radius:12px;font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;opacity:0;pointer-events:none}
.stamp.know{left:20px;color:var(--good);transform:rotate(-12deg)}
.stamp.again{right:20px;color:var(--bad);transform:rotate(12deg)}
.wcard[data-dir="r"] .stamp.know,.wcard[data-dir="l"] .stamp.again{opacity:var(--p)}
.wc-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .4s ease}
.wcard.flipped .wc-in{transform:rotateY(180deg)}
.wc-face{position:absolute;inset:0;padding:28px 22px 76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden}
.wc-face.back{transform:rotateY(180deg)}
.wc-face .lbl{position:absolute;top:24px;left:0;right:0}
.wc-word{font-size:clamp(40px,13vw,60px);font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.wc-word.sm{font-size:clamp(30px,9vw,40px)}
.wc-word rt{font-size:.38em;color:var(--ink-2)}
.wc-ro2{font-size:18px;font-weight:800;color:var(--accent)}
.wc-tap{position:absolute;bottom:84px;left:0;right:0;font-size:13px;font-weight:700;color:var(--lock-ink)}
.wc-g{font-size:21px;font-weight:800;line-height:1.35;text-wrap:balance}
.wc-ctx{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg);border-radius:16px;padding:10px 12px;margin-top:10px;width:100%}
.wc-ctx-jp{font-size:16px;line-height:1.6}
.wc-ctx mark{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 2px}
.wc-say{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:4}
.wbtns{display:flex;justify-content:center;align-items:center;gap:22px;padding:18px 16px 22px}
.wbtn{display:grid;justify-items:center;gap:2px;width:72px;height:72px;align-content:center;border-radius:50%;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--ink-2)}
.wbtn .ic{width:26px;height:26px}
.wbtn small{font-size:10.5px;font-weight:900}
.wbtn.no{color:var(--bad)}
.wbtn.ok{color:var(--good)}
.wbtn.flip{width:56px;height:56px}
.wbtn.flip small{display:none}
.wbtn:active{transform:translateY(2px);border-bottom-width:2px}
.wdone{grid-area:1/1;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center}
@media (max-height:700px){.wc-face{padding-bottom:64px}.wc-tap{bottom:70px}.wbtns{padding-block:10px 14px}.wbtn{width:62px;height:62px}}

.fbar{display:grid;grid-template-columns:56px 1fr 56px;gap:12px;flex:none}
.fb-side{height:54px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--ink-2);display:grid;place-items:center;transition:transform .06s}
.fb-side:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.fb-side .ic{width:24px;height:24px}
.fb-side.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.fb-side:disabled{opacity:.4}
.fb-next{min-height:54px;border-radius:16px;font-size:17px}
@media (max-height:720px){.stage.fstage{flex-basis:32%;min-height:136px}.wline{font-size:clamp(20px,6vw,25px);gap:8px 5px}.fpage{gap:10px}.obtn{width:36px;height:36px}.orail{gap:6px;top:8px;right:8px}}

/* breakdown sheet */
.bd{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s ease-out}
.bd.in{transform:none}
.bd-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid var(--line)}
.bd-top>b{text-align:center;font-weight:900;font-size:17px}
.bd-top .spk{justify-self:end}
.bd-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}
.bd-body>*{flex-shrink:0}
.bd-line{background:var(--accent);color:#FFFFFF;border-radius:20px;padding:14px 16px 16px;box-shadow:0 5px 0 var(--accent-deep);display:grid;gap:4px}
.bd-jp{font-size:26px;font-weight:700;line-height:1.85}
.bd-jp rt{font-size:.45em;opacity:.85}
.bd-ro{font-weight:700;opacity:.9}
.bd-en{font-weight:800;font-size:17px;line-height:1.35}
.ilg{display:flex;flex-wrap:wrap;gap:8px}
.il{display:grid;justify-items:center;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:5px 10px 6px;color:var(--ink);max-width:100%;min-width:0}
.il small{color:var(--accent);font-weight:800;font-size:11.5px;line-height:1.3}
.il b{font-size:20px;font-weight:700;line-height:1.55}
.il b rt{font-size:.5em;color:var(--ink-2)}
.il span{font-size:12px;color:var(--ink-2);font-weight:700;max-width:150px;text-align:center;line-height:1.25}
.il.g{border-style:dashed;border-bottom-style:solid}
.bdw{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 14px 14px;display:grid;gap:9px;scroll-margin-top:10px}
.bdw.g{background:transparent;border-style:dashed}
.bdw.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,45%{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}}
.bdw-head{display:flex;align-items:center;gap:12px}
.bdw-w{font-size:32px;font-weight:700;line-height:1.55}
.bdw-w rt{font-size:.42em;color:var(--ink-2)}
.bdw-side{flex:1;min-width:0;display:grid;gap:2px;justify-items:start}
.bdw-ro{font-weight:900;color:var(--accent);font-size:17px;line-height:1.2}
.bdw-r{font-size:13px;color:var(--ink-2)}
.bdw-r:empty{display:none}
.pos{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--info-ink);background:var(--info-soft);border-radius:99px;padding:0 8px;line-height:1.7}
.bdw-m{margin:0;padding-left:22px;display:grid;gap:3px;font-weight:700;line-height:1.35}
.bdw-m li::marker{color:var(--accent);font-weight:900}
.bdw-m1{font-weight:700;font-size:17px;line-height:1.35}
.bdw-note{background:var(--sub-soft);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.4}
.bdw-parts{display:grid;gap:5px}
.bdw-parts ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.bdw-parts li{display:flex;gap:10px;align-items:baseline;background:var(--bg);border-radius:10px;padding:4px 10px;font-size:14px;line-height:1.35}
.bdw-parts li b{font-size:18px;font-weight:700;flex:none;min-width:2.2em;line-height:1.6}
.bdw-parts li b rt{font-size:.5em;color:var(--ink-2)}
.bdw-parts li span{color:var(--ink-2);font-weight:700}
.btn.sm{min-height:40px;padding:8px 14px;font-size:13px;justify-self:start;box-shadow:0 3px 0 var(--line)}
.say-card{text-align:left;gap:8px;max-height:92%;overflow:auto}
.say-card .bd-top{border:0;padding:0 0 4px}
.lbody .subcard,.lbody .defs{flex:none;overflow:visible}
select.search{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.vtest:empty{display:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app"></div>

  while (a && b && a[a.length-1] === b[b.length-1]) { suf = a[a.length-1] + suf; a = a.slice(0, -1); b = b.slice(0, -1); }

    if (i === o.blank) inner = o.fill ? `<span class="blank filled">${o.fill}</span>` : '<span class="blank" aria-label="missing word"></span>';

function sfx(kind) {
  if (!S.set.sfx) return;
  try {
    if (!actx()) return;
    const seq = kind === 'good' ? [[880,0,.1],[1318.5,.09,.18]]
      : kind === 'bad' ? [[196,0,.24],[185,.02,.24]]
      : kind === 'win' ? [[523.25,0,.12],[659.25,.12,.12],[783.99,.24,.12],[1046.5,.36,.32]] : [];

      g.gain.exponentialRampToValueAtTime(.0001, t0 + st + d);

/* ---------- exercise builders ---------- */
const allLines = () => Object.values(LINES);

  const near = shuffle(ln.scene.lines.filter(x => x !== ln));

function exMcJp(ln) { return {t:'mcJp', ln, key:'L:'+ln.id, opts:shuffle([ln, ...lineDistractors(ln, x => x.jp)])}; }

  const extra = pool.filter(t => t.gram).slice(0, 1).concat(pool.filter(t => !t.gram).slice(0, 2));
  return {t: listen ? 'listen' : 'buildJp', ln, key:'L:'+ln.id, tiles:shuffle(ln.w.map(tokObj).concat(extra.map(t => ({s:t.s, r:t.r, ro:t.ro}))))};

  return {t:'buildEn', ln, key:'L:'+ln.id, target, tiles:shuffle(target.concat(dis))};

function exBlank(ln) {

  const content = idxs.filter(i => !isGram(ln.w[i]));
  const idx = (content.length && Math.random() < .7) ? pick(content) : pick(idxs);
  const tok = ln.w[idx], gram = isGram(tok);
  const notInLine = t => !ln.w.some(x => x[0] === t.s);
  let pool = distinctBy(shuffle(TOKENS.filter(t => t.gram === gram && t.s !== tok[0] && notInLine(t))), t => t.s);
  if (pool.length < 3) pool = distinctBy(pool.concat(shuffle(TOKENS.filter(t => t.s !== tok[0] && notInLine(t)))), t => t.s);

const exSayLine = ln => ({t:'say', key:'L:'+ln.id, jp:ln.jp, html:lineHTML(ln, {furi:true}), ro:romaji(ln), en:ln.en, ref:slow => TTS.speak(say(ln), {slow})});

function genEpisode(sc, level) {
  const L = sc.lines, multi = L.filter(isMulti), steps = [{t:'watch', sc}];
  if (level === 0) {
    L.forEach((ln, i) => { steps.push({t:'teach', ln}); steps.push(i % 2 ? exMcJp(ln) : exMcLine(ln)); });
    if (sc.wordKeys.length >= 3) steps.push(exMatch(sc.wordKeys));
    const mid = [];
    if (multi.length) mid.push(exBuildJp(pick(multi), false));
    shuffle(L).slice(0, 2).forEach(ln => mid.push(isMulti(ln) ? exBuildJp(ln, true) : exListenMc(ln)));
    if (multi.length) { mid.push(exBuildEn(pick(multi))); mid.push(exBlank(pick(multi))); }
    steps.push(...shuffle(mid));
    if (canSpeak()) steps.push(exSayLine(pick(L)));
    else steps.push(wordRecall(pick(sc.wordKeys)));
  } else {
    if (sc.wordKeys.length >= 3) steps.push(exMatch(sc.wordKeys));
    const mid = [];
    L.forEach(ln => mid.push(isMulti(ln) ? exBuildJp(ln, Math.random() < .5) : pick([exListenMc, exMcJp])(ln)));
    shuffle(multi).slice(0, 2).forEach(ln => mid.push(exBlank(ln)));
    if (multi.length) mid.push(exBuildEn(pick(multi)));
    steps.push(...shuffle(mid));
    if (canSpeak()) shuffle(L).slice(0, level >= 2 ? 2 : 1).forEach(ln => steps.push(exSayLine(ln)));
    shuffle(sc.wordKeys).slice(0, level >= 2 ? 2 : 1).forEach(k => steps.push(wordRecall(k)));
  }

  const lv = k => lvl(k), isNew = k => !(S.deck[k] && S.deck[k].st);
  const wk = keys.filter(k => kp(k) === 'W' && !isNew(k) && lv(k) <= 2).map(kid).filter(k => WORDS[k]);
  if (wk.length >= 4) { const m = exMatch(wk); steps.push(m); m.keys.forEach(k => used.add(k)); }
  const kk = keys.filter(k => kp(k) === 'K' && lv(k) <= 2).map(k => KID[kid(k)]).filter(it => it && !it.mark);

    if (used.has(k)) return;

      const ln = LINES[id], m = isMulti(ln);

    } else if (p === 'W') {

    } else if (p === 'K') {

      rest.push(pick(fns)());

      const hasTk = cl.ln.tk && JP.chunks(cl.ln.tk).length >= 2;

      rest.push(pick(fns)(cl, k));
    } else if (p === 'CW') {

      const fns = L <= 1 ? [exGMean] : L === 2 ? [exGMean, exGPick] : [exGPick].concat(sp ? [exGSay] : []);
      rest.push(pick(fns)(wo, k));

  rest.forEach(st => { if (st.teach) { cur = [st]; blocks.push(cur); } else if (cur && cur.length === 1 && cur[0].key === st.key) { cur.push(st); cur = null; } else blocks.push([st]); });

function recapKeys(rc) {

/* ---------- generic word exercises (scene words and words saved from your clips) ---------- */
function sceneWordObj(wk) { const w = WORDS[wk]; return {s:w.s, r:w.r, ro:w.ro, g:w.g, say:sayTok(w.s, w.r, w.ro)}; }
function clipWordObj(id) { const w = S.words[id]; return {s:w.b, r:w.r, ro:JP.kanaRomaji(w.r || w.b), g:w.g, say:w.say || w.r || w.b, ref:w.ref}; }
function shortGloss(g) { const parts = String(g || '').split(' / ').slice(0, 2).join(' / '); return parts.length > 90 ? parts.slice(0, 87).replace(/[;,]?\s+\S*$/, '') + '…' : parts; }
const keyWords = g => new Set(String(g || '').toLowerCase().match(/[a-z]{4,}/g) || []);
/* wrong answers that can't be read as right: no shared key words with the answer */
function glossPool(except) {
  const kw = keyWords(except);
  const pool = Object.values(S.words).map(w => w.g).concat(Object.values(WORDS).filter(w => !isGram([w.s, w.r, w.ro, w.g])).map(w => w.g), KWORDS.map(w => w.m));
  return distinctBy(shuffle(pool.filter(g => g && g !== except && ![...keyWords(g)].some(x => kw.has(x)))), g => g.toLowerCase());
}
function wordPool(except, exceptR, exceptG) {
  const kw = keyWords(exceptG), r0 = JP.hira(exceptR || except).slice(0, 2);
  const pool = Object.values(S.words).map(w => ({s:w.b, r:w.r, g:w.g})).concat(Object.values(WORDS).filter(w => !isGram([w.s, w.r, w.ro, w.g])).map(w => ({s:w.s, r:w.r, g:w.g})));
  return distinctBy(shuffle(pool.filter(w => w.s !== except && JP.hira(w.r || w.s).slice(0, 2) !== r0 && !(w.s.includes(except) || except.includes(w.s)) && ![...keyWords(w.g)].some(x => kw.has(x)))), w => w.s);
}
const exGMean = (wo, key) => ({t:'gMean', wo, key, opts:shuffle([wo.g, ...glossPool(wo.g).slice(0, 3)])});
const exGPick = (wo, key) => ({t:'gPick', wo, key, opts:shuffle([{s:wo.s, r:wo.r}, ...wordPool(wo.s, wo.r, wo.g).slice(0, 3)])});
const exGSay = (wo, key) => ({t:'say', key, jp:wo.s, html:rb(wo.s, wo.r, true), ro:wo.ro, en:wo.g, ref:slow => TTS.speak(wo.say, {slow}), word:true});

/* ---------- clip exercises ---------- */
function clipLineDistractors(cl) {
  const mine = cl.ln.jp;
  const same = shuffle(cl.clip.lines.filter(l => l !== cl.ln).map(l => l.jp));
  const other = shuffle(CLIPS.filter(c => c !== cl.clip).flatMap(c => (c.lines || []).map(l => l.jp)));
  const scene = shuffle(allLines().map(l => l.jp));
  const near = nearMiss(cl.ln);
  const norm = x => x.replace(/[\s、。！？!?…〜ー]/g, '');
  return distinctBy([near, ...same.slice(0, 3), ...other.slice(0, 3), ...scene].filter(x => x && norm(x) !== norm(mine)), norm).slice(0, 3);
}
/* a believable wrong answer: the same line with one word swapped */
function nearMiss(ln) {
  if (!ln.tk) return null;
  const toks = ln.tk.filter(t => !JP.isPunct(t));
  const content = ln.tk.map((t, i) => i).filter(i => !JP.isPunct(ln.tk[i]) && !JP.isGram(ln.tk[i]) && ln.tk[i].pos !== '記号');
  if (!content.length || toks.length < 2) return null;
  const i = pick(content), t = ln.tk[i];
  const pool = shuffle(allClipTokens().concat(sceneTokens()).filter(x => x.pos === t.pos && x.s !== t.s && !JP.isGram(x)));
  if (!pool.length) return null;
  return ln.tk.map((x, j) => j === i ? pool[0].s : x.s).join('');
}
let tokCache = null;
function allClipTokens() {
  if (tokCache) return tokCache;
  tokCache = distinctBy(CLIPS.flatMap(c => (c.lines || []).flatMap(l => l.tk || [])), t => t.s);
  return tokCache;
}
let sceneTokCache = null;
function sceneTokens() {
  if (!JP.isReady()) return [];
  if (!sceneTokCache) sceneTokCache = TOKENS.filter(t => !t.gram).map(t => { const a = JP.analyze(t.s); return a.length === 1 ? {s:t.s, r:t.r, pos:a[0].pos, p1:a[0].p1} : null; }).filter(Boolean);
  return sceneTokCache;
}
function exCHear(cl, key) { return {t:'cHear', cl, key, opts:shuffle([cl.ln.jp, ...clipLineDistractors(cl)])}; }
function exCMean(cl, key) {
  if (!cl.ln.en) return exCHear(cl, key);
  const pool = distinctBy(shuffle(CLIPS.flatMap(c => (c.lines || []).filter(l => l.en && l !== cl.ln).map(l => l.en)).concat(allLines().map(l => l.en))), x => x.toLowerCase()).filter(x => x !== cl.ln.en);
  if (pool.length < 3) return exCHear(cl, key);
  return {t:'cMean', cl, key, opts:shuffle([cl.ln.en, ...pool.slice(0, 3)])};
}
function exCBuild(cl, key) {
  const ch = JP.chunks(cl.ln.tk);
  if (ch.length < 2 || ch.length > 9) return exCHear(cl, key);
  const mine = new Set(ch.map(c => c.s));
  const extra = distinctBy(shuffle(CLIPS.flatMap(c => (c.lines || []).filter(l => l.tk && l !== cl.ln).flatMap(l => JP.chunks(l.tk).map(x => x.s)))), x => x).filter(x => !mine.has(x)).slice(0, ch.length > 6 ? 2 : 3);
  return {t:'cBuild', cl, key, target:ch.map(c => c.s).join(''), tiles:shuffle(ch.map(c => ({s:c.s, toks:c.toks})).concat(extra.map(x => ({s:x}))))};
}
function exCGap(cl, key) {
  const ch = JP.chunks(cl.ln.tk);
  const cand = ch.map((c, i) => i).filter(i => c_isContent(ch[i]));
  if (!cand.length) return exCHear(cl, key);
  const idx = pick(cand), ans = ch[idx].s;
  const pool = distinctBy(shuffle(CLIPS.flatMap(c => (c.lines || []).filter(l => l.tk).flatMap(l => JP.chunks(l.tk))).concat(allLines().flatMap(l => l.w.filter(t => !isGram(t)).map(t => ({s:t[0]}))))).map(c => c.s), x => x)
    .filter(x => x !== ans && !ch.some(c => c.s === x));
  if (pool.length < 3) return exCHear(cl, key);
  return {t:'cGap', cl, key, ch:ch.map(c => c.s), idx, opts:shuffle([ans, ...pool.slice(0, 3)])};
}
function c_isContent(c) { return c.toks.some(t => !JP.isGram(t) && !JP.isPunct(t)); }

/* ---------- one shared video element: once you tap play, it can keep playing on its own ---------- */
const VID = h('video', {playsinline:true, 'webkit-playsinline':true, preload:'auto', class:'vid'});
VID.disableRemotePlayback = true;
let unlocked = false, segRaf = 0, segToken = 0;
VID.addEventListener('play', () => { unlocked = true; document.querySelectorAll('.tapplay').forEach(b => { b.hidden = true; }); });
function stopSeg() { segToken++; cancelAnimationFrame(segRaf); try { VID.pause(); } catch (e) {} }
/* Plays one subtitle line of a clip inside `slot`. Loops `loops` extra times with a short gap. */
function playLine(cl, o = {}) {
  const slot = o.slot || document.querySelector('.vslot');
  if (!slot) return;
  if (VID.parentNode !== slot) slot.append(VID);
  const my = ++segToken; cancelAnimationFrame(segRaf);
  const s = Math.max(0, cl.ln.s - 0.12), e = cl.ln.e + 0.2;
  let loopsLeft = o.loops || 0;
  const go = url => {
    if (my !== segToken) return;
    VID.playbackRate = o.rate || 1;
    if (VID.dataset.clip !== cl.clip.id) { VID.dataset.clip = cl.clip.id; VID.src = url + '#t=' + s.toFixed(2); }
    else { try { VID.currentTime = s; } catch (x) {} }
    const p = VID.play();
    if (p && p.catch) p.catch(() => { if (my === segToken) showTap(slot, () => playLine(cl, o)); });
    const watch = () => {
      if (my !== segToken) return;
      if (!VID.paused && VID.currentTime >= e) {
        VID.pause();
        if (loopsLeft > 0) { loopsLeft--; setTimeout(() => { if (my === segToken) { try { VID.currentTime = s; } catch (x) {} VID.play().catch(() => {}); segRaf = requestAnimationFrame(watch); } }, 700); return; }
        if (o.onEnd) o.onEnd();
        return;
      }
      segRaf = requestAnimationFrame(watch);
    };
    segRaf = requestAnimationFrame(watch);
  };
  const cached = URLS.get(cl.clip.id);
  if (cached) go(cached);
  else ensureUrl(cl.clip).then(u => u ? go(u) : toast('This video is missing from the device. Add it again from Library.'));
}
function showTap(slot, fn) {

  let b = st.querySelector('.tapplay');
  if (!b) { b = h('button', {type:'button', class:'tapplay'}, h('span', {class:'pv-ic'}, icon('play')), 'Tap to play'); st.append(b); }
  b.hidden = false; b.onclick = e => { e.stopPropagation(); b.hidden = true; fn(); };
}

async function openWord(src) {
  let t, ctxRef = null, gloss = '', pos = '', sceneTok = null;
  if (src.scene) { const [lid, i] = src.scene.split('|'); sceneTok = LINES[lid].w[+i]; t = {s:sceneTok[0], r:sceneTok[1] || (JP.isKana(sceneTok[0]) ? JP.hira(sceneTok[0]) : ''), b:sceneTok[0], p:''}; gloss = sceneTok[3]; }
  else { const [ref, i] = src.clip.split('|'); const cl = clipLine(ref); if (!cl || !cl.ln.tk) return; t = cl.ln.tk[+i]; ctxRef = ref; }
  const isG = !sceneTok && JP.isGram(t);
  const head = h('div', {class:'ws-head'},
    h('div', {class:'ws-w', lang:'ja', html:JP.rb(t.s, t.r, true)}),
    h('div', {class:'ws-side'}, h('div', {class:'ws-ro'}, (t.r || '') + (t.r ? ' · ' : '') + JP.kanaRomaji(t.p || t.r || t.s)), h('div', {class:'ws-pos'}, sceneTok ? '' : JP.posEn(t))),
    h('button', {class:'spk', type:'button', 'aria-label':'Play the word', onclick:() => TTS.speak(t.r || t.s)}, icon('speaker')));
  const body = h('div', {class:'ws-body'});
  const foot = h('div', {class:'ws-foot'});
  sheetEl.replaceChildren(h('div', {class:'ws-grab', 'aria-hidden':'true'}), head, body, foot);
  sheetEl.hidden = false; requestAnimationFrame(() => sheetEl.classList.add('in'));
  TTS.speak(t.r || t.s);
  if (sceneTok) { body.append(h('p', {class:'ws-g'}, gloss)); return; }
  const note = JP.gram(t);
  if (note && isG) body.append(h('p', {class:'ws-g'}, note));
  if (t.b && t.b !== t.s) body.append(h('p', {class:'small'}, 'Dictionary form: ', h('b', {lang:'ja'}, t.b)));
  if (!isG || !note) {
    const g = h('p', {class:'ws-g muted'}, 'Looking it up…'); body.append(g);
    try {
      await JP.loadDict();
      const e = JP.lookup(t.b, t.r) || JP.lookup(t.s, t.r);
      if (e) { gloss = e.g; pos = e.pos; g.className = 'ws-g'; g.textContent = e.g; if (e.prio >= 2) body.append(h('span', {class:'chip-s'}, 'Common word')); }
      else g.textContent = note || 'Not in the dictionary. It may be a name or slang.';

  }
  if (!isG && gloss) {
    const id = t.b, inDeck = !!S.deck['CW:' + id];
    const btn = h('button', {class:'btn wide' + (inDeck ? ' ghost' : ''), type:'button'}, inDeck ? 'In your deck' : 'Add word to deck');
    btn.onclick = () => {
      if (S.deck['CW:' + id]) { delete S.deck['CW:' + id]; btn.textContent = 'Add word to deck'; btn.classList.remove('ghost'); }
      else { S.words[id] = {b:t.b, s:t.s, r:t.b === t.s ? t.r : (JP.lookup(t.b, '') || {n:[t.r]}).n[0], g:shortGloss(gloss), pos, ref:ctxRef}; deckAdd(['CW:' + id]); btn.textContent = 'In your deck'; btn.classList.add('ghost'); toast('Added. It will show up in Review.'); }

    };

  }
}

/* ---------- importing videos and subtitle files ---------- */
const SUBX = /\.(srt|vtt|ass|ssa)$/i;

async function importFiles(files) {
  const subs = files.filter(f => SUBX.test(f.name)), media = files.filter(f => !SUBX.test(f.name));
  const made = [];
  for (const f of media) { const c = await importMedia(f); if (c) made.push(c); }
  for (const sf of subs) {
    let target = made.find(c => baseName(sf.name).startsWith(c.name) || c.name.startsWith(baseName(sf.name)));
    if (!target && made.length === 1) target = made[0];
    if (!target && view.attachTo && CL[view.attachTo]) target = CL[view.attachTo];
    if (!target && CLIPS[0]) target = CLIPS[0];
    if (target) await attachSubs(target, sf);
  }
  view.attachTo = null;
  if (made.length) {
    view.tab = 'clips'; view.clipMode = 'library';
    const c = made[0];
    if (!c.lines.length) { view.clipId = c.id; render(); startTranscribe(c); }
    else openCards(c);
  } else render();
}
function probe(file) {
  return new Promise(res => {
    const isAudio = /^audio\//.test(file.type) || /\.(mp3|m4a|wav|aac|ogg)$/i.test(file.name);
    const v = document.createElement(isAudio ? 'audio' : 'video');
    v.muted = true; v.preload = 'metadata'; v.playsInline = true;
    const u = URL.createObjectURL(file);
    let done = false;
    const fin = r => { if (done) return; done = true; clearTimeout(t); URL.revokeObjectURL(u); res(r); };
    const t = setTimeout(() => fin(null), 12000);
    v.onerror = () => fin(null);
    v.onloadedmetadata = () => {
      const duration = v.duration;
      if (isAudio || !v.videoWidth) return fin({duration, thumb:null});
      v.currentTime = Math.min(1.5, duration / 3);
      v.onseeked = () => {
        try {
          const cv = document.createElement('canvas'); cv.width = 320; cv.height = Math.round(320 * v.videoHeight / v.videoWidth) || 180;
          cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
          fin({duration, thumb:cv.toDataURL('image/jpeg', .72)});
        } catch (e) { fin({duration, thumb:null}); }

    };
    v.src = u;
  });
}
async function importMedia(file, extra = {}) {
  const info = await probe(file);

  const c = {id:'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name:baseName(file.name).slice(0, 80), added:Date.now(), size:file.size, type:file.type, duration:info.duration, thumb:info.thumb, lines:[], subs:'none', ...extra};
  try { await DB.putBlob(c.id, file); await saveClip(c); }
  catch (e) { toast('There is not enough space on this phone to save that video.'); return null; }
  DB.persist();
  if (info.duration > 600) toast('Long video: making subtitles may take a while. Clips under 5 minutes work best.', 6000);
  return c;
}
async function attachSubs(c, file) {
  const text = await file.text();
  const {cues, lang} = JP.parseSubs(text, file.name);
  if (!cues.length) { toast(`No subtitles found in ${file.name}.`); return; }
  if (lang === 'ja') {
    c.lines = cues.map(q => ({s:q.s, e:q.e, jp:JP.cleanSpeaker(q.text)})).filter(l => JP.isJa(l.jp));
    c.subs = 'file';
    if (c.enCues) JP.alignEn(c.lines, c.enCues);

}

/* ---------- making subtitles with Whisper ---------- */
let JOB = null, wakeLock = null;
function jobUpdate(p) { Object.assign(JOB, p); const b = document.querySelector('.job'); if (b) { const n = jobBanner(); if (n) b.replaceWith(n); } else if (!lesson && view.tab === 'clips') render(); document.querySelectorAll('.ccard').forEach(() => {}); }
async function startTranscribe(c) {
  if (JOB && !JOB.error) { toast('Already making subtitles for another clip. One at a time.'); return; }
  const model = S.set.model;
  JOB = {clipId:c.id, pct:0, msg:'Getting ready…'};
  render();
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  try {
    const files = {};
    const onDl = m => {
      if (m.file) files[m.file] = {l:m.loaded || 0, t:m.total || 0};
      const L = Object.values(files).reduce((a, x) => a + x.l, 0), T = Object.values(files).reduce((a, x) => a + x.t, 0);
      if (T > 0 && L < T) jobUpdate({pct:L / T * .3, msg:`Downloading the ${ASR.MODELS[model].label} speech model, ${Math.round(L / T * 100)}% (one time only).`});
    };
    jobUpdate({msg:'Loading the speech model…'});
    const r = await ASR.load(model, onDl);
    jobUpdate({pct:.3, msg:'Reading the audio…'});
    const blob = await DB.getBlob(c.id);
    const pcm = await ASR.decode(blob);
    const wantEn = S.set.translate && model !== 'turbo';
    const span = wantEn ? .4 : .62;
    jobUpdate({pct:.32, msg:`Listening${r.device === 'webgpu' ? ' (GPU)' : ''}…`});
    const jp = await ASR.transcribe(pcm, model, {onProgress:f => jobUpdate({pct:.32 + f * span, msg:`Listening, ${Math.round(f * 100)}%${r.device === 'webgpu' ? ' (GPU)' : ''}…`})});
    let lines = toLines(jp.chunks, c.duration);
    if (!lines.length) throw new Error('No Japanese speech was found in this clip.');
    if (wantEn) {
      jobUpdate({pct:.72, msg:'Writing English subtitles…'});
      const en = await ASR.transcribe(pcm, model, {task:'translate', onProgress:f => jobUpdate({pct:.72 + f * .22, msg:`Writing English subtitles, ${Math.round(f * 100)}%…`})});

    } else if (c.enCues) JP.alignEn(lines, c.enCues);
    jobUpdate({pct:.96, msg:'Splitting words…'});
    c.lines = lines; c.subs = 'auto'; c.model = model;
    Object.keys(S.deck).forEach(k => { if (k.startsWith('C:' + c.id + '#') && !S.deck[k].st) delete S.deck[k]; });
    await tokenizeClip(c);
    await saveClip(c);
    JOB = null; save();
    toast(`Subtitles ready: ${lines.length} cards. Tap any word.`, 4000);
    if (!lesson) openCards(c);
  } catch (e) {
    JOB.error = friendlyErr(e);
    if (!lesson) render();
  } finally { try { if (wakeLock) await wakeLock.release(); } catch (e) {} wakeLock = null; }
}
function friendlyErr(e) {
  const m = (e && e.message) || String(e);

  if (/fetch|network|Failed to load|404/i.test(m)) return 'The speech model couldn’t download. Check your connection and try again.';
  if (/memory|allocation|OOM/i.test(m)) return 'The phone ran out of memory. Try a shorter clip or the Fast model.';

/* Whisper chunks → subtitle lines, splitting long chunks at sentence ends. */
function toLines(chunks, dur) {

  chunks.forEach(c => {
    const text = JP.cleanSpeaker(c.text.replace(/\s+/g, ' ').trim());
    if (!JP.isJa(text) || /ご視聴|チャンネル登録|ご清聴|字幕(作成|提供)/.test(text)) return;

}
